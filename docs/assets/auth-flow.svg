<polygon points="275.0,522 265.0,517 265.0,527" fill="#79c0ff"/>
<text x="372.5" y="560" text-anchor="middle" fill="#c9d1d9" font-size="12.5">POST /api/v1/users/verify-</text>
<text x="372.5" y="574" text-anchor="middle" fill="#c9d1d9" font-size="12.5">email-otp</text>
<text x="249.0" y="588" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="700">8</text>
